<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ZONE DE GUERRE — Astartes / Waaagh!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ash:#11151a;        /* fond profond */
  --ash2:#1a2027;
  --steel:#39434c;
  --bone:#ded8c8;       /* texte */
  --rust:#c05a2e;       /* accent / danger */
  --gold:#d0a63a;
  --sm:#3f7bd8;  --smd:#16305f;  --sm2:#d7e6ff;   /* Ultramarines */
  --ork:#8aae2b; --orkd:#33490d; --ork2:#effbc7;  /* Orks */
  --ink:#080b0e;
  --ts:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ash);color:var(--bone);
  font-family:"Barlow Semi Condensed",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column;
  background-image:radial-gradient(circle at 50% -10%,#242c34 0%,#0d1115 68%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.stencil{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- barre haute ---------- */
#top{display:flex;align-items:center;gap:8px;padding:7px 10px;background:linear-gradient(#242c34,#151a20);
  border-bottom:2px solid #000;box-shadow:0 2px 0 #39434c inset,0 -3px 0 var(--gold) inset}
#faction{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
#fdot{width:12px;height:12px;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 10px currentColor;background:currentColor}
#fname{font-size:15px;line-height:1}
#tsub{font-size:11px;opacity:.55;letter-spacing:.1em}
.pill{display:flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid var(--steel);border-radius:3px;
  background:#100f0d;font-size:13px;font-variant-numeric:tabular-nums}
.pill b{font-family:Oswald,sans-serif;color:var(--gold);font-size:15px}
.iconbtn{width:34px;height:32px;border:1px solid var(--steel);border-radius:3px;background:#100f0d;font-size:14px;
  display:flex;align-items:center;justify-content:center}
.iconbtn.on{border-color:var(--rust);color:#ffb08a;background:#2a1610}

/* ---------- plateau ---------- */
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;position:relative}
#board{position:relative;background:#0e1317;
  box-shadow:0 0 0 1px #000,0 0 0 5px #232a31,0 0 0 6px #000,0 14px 34px #000c}
#board::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background:radial-gradient(ellipse at 50% 45%,transparent 52%,#000a 100%)}
.t{position:absolute;overflow:hidden}
.t svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grid{position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:linear-gradient(#00000055 1px,transparent 1px),linear-gradient(90deg,#00000055 1px,transparent 1px);
  background-size:var(--ts) var(--ts);background-position:-1px -1px}
.ov{position:absolute;pointer-events:none;z-index:2}
.ov svg{width:100%;height:100%;display:block}
.ov.mv{background:#3f7bd82b;box-shadow:inset 0 0 0 1px #86b3ff2e}
.ov.mv::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;background:#a8c8ff;opacity:.55}
.ov.at{background:repeating-linear-gradient(45deg,#c0392b2e 0 3px,transparent 3px 8px);
  box-shadow:inset 0 0 0 1px #ff8a7a26}
.ov.dz{background:repeating-linear-gradient(-45deg,#c0392b26 0 2px,transparent 2px 7px);
  box-shadow:inset 0 0 0 1px #ff6a4a2e}
.ov.tg{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}

/* pions : pastilles de wargame */
.u{position:absolute;z-index:3;transition:transform .13s linear;display:flex;align-items:center;justify-content:center}
.u .box{position:relative;width:84%;height:84%;display:flex;align-items:center;justify-content:center;border-radius:2px}
.u.sm .box{background:linear-gradient(158deg,#4d89e6 0%,#2a5aa8 46%,#16305f 100%);
  box-shadow:0 2px 0 #0a1c3c,0 3px 7px #0008,inset 0 0 0 1px #9dc2ff4d,inset 0 0 0 3px #ffffff0f}
.u.ork .box{background:linear-gradient(158deg,#9ac034 0%,#5d7c17 46%,#33490d 100%);
  clip-path:polygon(0 15%,15% 0,100% 0,100% 85%,85% 100%,0 100%);
  box-shadow:0 2px 0 #1c2806,0 3px 7px #0008,inset 0 0 0 1px #cbe98a4d}
.u svg{width:68%;height:68%;display:block;overflow:visible;fill:none}
.u.sm svg{stroke:#e2edff;color:#e2edff;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.u.ork svg{stroke:#f3fdd4;color:#f3fdd4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.u svg .f{fill:currentColor;stroke:none}
.u .gauge{position:absolute;left:9%;right:9%;bottom:7%;height:3px;background:#00000073;border-radius:2px;overflow:hidden}
.u .gauge i{display:block;height:100%;background:var(--gold);transition:width .2s}
.u .gauge i.low{background:#e2703a}
.u .hp{position:absolute;right:-4px;bottom:-5px;min-width:15px;height:15px;padding:0 2px;border-radius:2px;
  background:#0b0f13;box-shadow:0 0 0 1px #000,0 1px 3px #0009;color:#f2e2ad;
  font-family:Oswald,sans-serif;font-size:11px;line-height:14px;text-align:center}
.u .hp.low{color:#ff9d78}
.u .cap{position:absolute;left:-4px;top:-5px;width:15px;height:15px;border-radius:2px;background:#2b2205;
  box-shadow:0 0 0 1px #000;color:var(--gold);font-family:Oswald,sans-serif;font-size:10px;line-height:14px;text-align:center}
.u.done .box{filter:saturate(.2) brightness(.5);box-shadow:0 1px 0 #0009}
.u.sel{z-index:5}
.u.sel .box{outline:2px solid var(--gold);outline-offset:2px;animation:lift .85s infinite alternate ease-in-out}
@keyframes lift{from{transform:none;box-shadow:0 3px 6px #0008}
  to{transform:translateY(-4px) scale(1.05);box-shadow:0 9px 12px #000a}}
.u.hit .box{animation:shake .26s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* bâtiments */
.b-owner{position:absolute;left:0;right:0;bottom:0;height:5px;box-shadow:0 -1px 0 #0009}
.b-cap{position:absolute;left:2px;top:2px;font-family:Oswald,sans-serif;font-size:9px;line-height:11px;color:#12161a;
  background:var(--gold);padding:0 3px;border-radius:1px}

/* ---------- panneau bas ---------- */
#bot{background:linear-gradient(#1c1a17,#121110);border-top:2px solid #000;box-shadow:0 -2px 0 #3a3833 inset;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));min-height:118px;display:flex;flex-direction:column;gap:7px}
#msg{font-size:13px;opacity:.75;line-height:1.25;min-height:16px}
#card{display:flex;gap:9px;align-items:center}
#card .por{width:46px;height:46px;border-radius:2px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#card .por.sm{background:linear-gradient(158deg,#4d89e6,#2a5aa8 46%,#16305f);
  box-shadow:inset 0 0 0 1px #9dc2ff4d,inset 0 0 0 3px #ffffff0f,0 2px 0 #0a1c3c}
#card .por.ork{background:linear-gradient(158deg,#9ac034,#5d7c17 46%,#33490d);
  clip-path:polygon(0 15%,15% 0,100% 0,100% 85%,85% 100%,0 100%);box-shadow:inset 0 0 0 1px #cbe98a4d}
#card .por svg{width:64%;height:64%;fill:none;stroke:#eef5ff;color:#eef5ff;stroke-width:1.9;overflow:visible}
#card .por.ork svg{stroke:#f3fdd4;color:#f3fdd4;stroke-linecap:round;stroke-linejoin:round}
#card .por svg .f{fill:currentColor;stroke:none}
#nm{font-size:15px;line-height:1.1}
#stats{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.st{font-size:11px;padding:2px 5px;border:1px solid var(--steel);border-radius:3px;background:#0e0d0c;font-variant-numeric:tabular-nums}
.st u{text-decoration:none;opacity:.5;letter-spacing:.06em}
.st b{font-family:Oswald,sans-serif;color:#ffe9a8}
#acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:70px;padding:11px 6px;border-radius:4px;border:1px solid var(--steel);
  background:linear-gradient(#2c2924,#1b1916);font-size:13px;font-family:Oswald,sans-serif;text-transform:uppercase;
  letter-spacing:.08em;box-shadow:0 2px 0 #000;transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.go{background:linear-gradient(#c0562c,#8a3717);border-color:#e08a5a;color:#fff2e6}
.btn.warn{background:linear-gradient(#7a1f16,#4d100b);border-color:#c0392b}
.btn.ghost{background:#141311;opacity:.85;flex:0 0 auto;min-width:56px}
.btn[disabled]{opacity:.35}
#preview{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--rust);border-radius:4px;
  background:#1d100c;font-variant-numeric:tabular-nums}
#preview .side{flex:1;font-size:12px}
#preview .big{font-family:Oswald,sans-serif;font-size:19px}
.dead{color:#ff7a5c}

/* relevé de combat */
#combat{position:absolute;left:6px;right:6px;bottom:4px;z-index:20;display:none;
  background:#0c1117f5;border:1px solid var(--steel);border-top-color:#5a6672;border-radius:4px;
  box-shadow:0 12px 34px #000c;padding:9px 11px 10px;max-height:66%;overflow:auto}
#combat.show{display:block;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#combat .ch{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:7px;
  padding-bottom:6px;border-bottom:1px solid #ffffff14}
#combat .ch b{font-family:Oswald,sans-serif;font-weight:400;letter-spacing:.03em}
#combat .ch .arrow{color:var(--rust);font-size:15px}
.who{width:21px;height:21px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.who svg{width:70%;height:70%;fill:none;stroke:#fff;color:#fff;stroke-width:2;overflow:visible}
.who svg .f{fill:currentColor;stroke:none}
